<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="Dokumentasi bukti distribusi koran - foto, PDF, dan backup lokal">
  <title>Distribusi Koran</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite">
      <div class="container center muted" style="padding-top:40vh">Memuat…</div>
    </main>
  </div>

  <nav id="nav" class="nav" aria-label="Navigasi utama">
    <a href="#/home" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Beranda</span>
    </a>
    <a href="#/prepare" data-nav="start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.5 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.5L15 4zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
      <span>Mulai Distribusi</span>
    </a>
    <a href="#/archive" data-nav="archive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v4H3zm1 5h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zm5 3v2h6v-2z"/></svg>
      <span>Arsip</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      <span>Pengaturan</span>
    </a>
  </nav>

  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <div id="busy" class="busy" hidden>
    <div class="busy-card" role="alertdialog" aria-live="assertive">
      <div class="spinner" aria-hidden="true"></div>
      <p id="busy-text">Memproses…</p>
      <div class="bar"><div id="busy-bar"></div></div>
      <p id="busy-sub" class="muted"></p>
    </div>
  </div>

  <!-- Input file persisten (di luar view yang dirender ulang) -->
  <input type="file" id="camInput" class="sr-only" accept="image/*" capture="environment">
  <input type="file" id="logoInput" class="sr-only" accept="image/*">
  <input type="file" id="restoreInput" class="sr-only" accept=".zip,application/zip,application/x-zip-compressed">

  <noscript><p style="padding:24px">Aplikasi ini membutuhkan JavaScript.</p></noscript>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="db.js"></script>
  <script src="pdf.js"></script>
  <script src="backup.js"></script>
  <script src="app.js"></script>
</body>
</html>
